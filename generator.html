<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>拼豆圖紙產生器</title>
<style>
  :root{
    --bg:#f7f7f5; --panel:#ffffff; --ink:#1f2328; --ink-soft:#6b7280;
    --border:#e6e6e3; --accent:#2563eb; --accent-ink:#ffffff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;}
  .app{max-width:780px;margin:0 auto;padding:14px 16px 40px;}
  header{padding:6px 2px 14px;}
  header a{color:var(--accent);text-decoration:none;font-size:.85rem;font-weight:600;}
  header h1{font-size:1.2rem;font-weight:700;margin:6px 0 0;}
  header p{margin:4px 0 0;font-size:.8rem;color:var(--ink-soft);line-height:1.5;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;}
  .card h2{font-size:.95rem;margin:0 0 10px;}
  .pick{display:flex;align-items:center;justify-content:center;gap:6px;padding:14px;border:1.5px dashed var(--border);
    border-radius:12px;font-weight:600;font-size:.95rem;color:var(--accent);cursor:pointer;}
  .preview{display:block;max-width:100%;max-height:220px;margin:12px auto 0;border-radius:8px;}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
  label.field{display:block;font-size:.8rem;font-weight:600;}
  label.field input[type=number]{display:block;width:100%;margin-top:6px;font-size:1rem;padding:9px 10px;border:1px solid var(--border);border-radius:10px;}
  .slider{margin-top:14px;}
  .slider input[type=range]{width:100%;margin-top:8px;}
  .kbox{display:flex;align-items:center;gap:6px;margin-top:6px;font-weight:400;}
  .kbox input{width:90px;font-size:1rem;padding:8px 10px;border:1px solid var(--border);border-radius:10px;}
  .check{display:flex;align-items:center;gap:8px;font-size:.85rem;margin-top:12px;}
  .check input{width:18px;height:18px;}
  .primary{width:100%;margin-top:16px;background:var(--accent);color:var(--accent-ink);border:none;border-radius:10px;padding:12px;font-size:1rem;font-weight:700;cursor:pointer;}
  .primary:disabled{opacity:.4;cursor:default;}
  .secondary{width:100%;margin-top:10px;background:var(--bg);color:var(--ink);border:1px solid var(--border);border-radius:10px;padding:11px;font-size:.95rem;font-weight:600;cursor:pointer;}
  .summary{font-size:.9rem;font-weight:600;margin-bottom:10px;}
  .scroll{overflow:auto;border:1px solid var(--border);border-radius:8px;background:#fff;}
  .scroll img{display:block;width:100%;height:auto;}
  .hint{font-size:.78rem;color:var(--ink-soft);margin:8px 0 0;line-height:1.5;}
  .legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;}
  .chip{display:flex;align-items:center;gap:8px;font-size:.82rem;padding:6px;border:1px solid var(--border);border-radius:10px;}
  .sw{width:30px;height:30px;border-radius:50%;border:1px solid rgba(0,0,0,.15);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;}
  .chip b{display:block;}
  .chip span{color:var(--ink-soft);font-size:.75rem;}
  .status{font-size:.85rem;color:var(--ink-soft);margin-top:10px;}
</style>
</head>
<body>
<div class="app">
  <header>
    <a href="./">‹ 回圖庫</a>
    <h1>🎨 拼豆圖紙產生器</h1>
    <p>選一張照片,自動轉成拼豆圖紙與顏色清單。照片只在這台裝置上處理,不會上傳到任何地方。</p>
  </header>

  <div class="card">
    <label class="pick">📷 選擇照片<input type="file" id="file" accept="image/*" hidden></label>
    <img class="preview" id="preview" alt="" hidden>
    <div class="row">
      <label class="field">寬(顆)<input type="number" id="w" value="29" min="5" max="150" inputmode="numeric"></label>
      <label class="field">高(顆)<input type="number" id="h" value="29" min="5" max="150" inputmode="numeric"></label>
    </div>
    <label class="check"><input type="checkbox" id="keep" checked>維持照片比例</label>
    <label class="field slider">顏色數量(最多 221 色)<span class="kbox"><input type="number" id="kn" min="2" max="221" value="12" inputmode="numeric"> 色</span><input type="range" id="k" min="2" max="221" value="12"></label>
    <label class="check"><input type="checkbox" id="nums" checked>格子裡顯示色號</label>
    <label class="check"><input type="checkbox" id="bg">去除背景(和四個角落相連的同色區域變成空白)</label>
    <button class="primary" id="go" disabled>產生圖紙</button>
    <div class="status" id="status"></div>
  </div>

  <div id="result" hidden>
    <div class="card">
      <div class="summary" id="summary"></div>
      <div class="scroll"><img id="out" alt="拼豆圖紙"></div>
      <p class="hint">每 10 格一條粗線。iPhone 長按圖紙可「儲存到照片」;雙指可放大。</p>
      <button class="secondary" id="dl">下載圖紙</button>
    </div>
    <div class="card">
      <h2>顏色清單(依用量排序)</h2>
      <div class="legend" id="legend"></div>
      <p class="hint">色號只是這張圖紙的編號,請依顏色自行對應手邊的豆子。</p>
    </div>
  </div>
</div>
<script>
var $ = function(id){ return document.getElementById(id); };
var img = null, ratio = 1, lastPng = null;

// ---------- 顏色工具 ----------
function srgbToLinear(c){ c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
function rgbToLab(r, g, b){
  var R = srgbToLinear(r), G = srgbToLinear(g), B = srgbToLinear(b);
  var x = (R * 0.4124 + G * 0.3576 + B * 0.1805) / 0.95047;
  var y = (R * 0.2126 + G * 0.7152 + B * 0.0722);
  var z = (R * 0.0193 + G * 0.1192 + B * 0.9505) / 1.08883;
  var f = function(t){ return t > 0.008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116; };
  var fx = f(x), fy = f(y), fz = f(z);
  return [116 * fy - 16, 500 * (fx - fy), 200 * (fy - fz)];
}
function dist2(a, b){ var d0 = a[0] - b[0], d1 = a[1] - b[1], d2 = a[2] - b[2]; return d0 * d0 + d1 * d1 + d2 * d2; }
function hex(c){ return '#' + c.map(function(v){ return ('0' + Math.round(v).toString(16)).slice(-2); }).join('').toUpperCase(); }
function textOn(c){ return (0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2]) > 150 ? '#000' : '#fff'; }
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- 取樣:每格切成 s×s 個小點,保留每個小點的顏色 ----------
function sample(image, w, h){
  var s = Math.max(3, Math.min(8, Math.floor(1800 / Math.max(w, h))));
  var c = document.createElement('canvas'); c.width = w * s; c.height = h * s;
  var x = c.getContext('2d'); x.imageSmoothingQuality = 'high';
  x.drawImage(image, 0, 0, c.width, c.height);
  return { s: s, w: w, h: h, W: c.width, data: x.getImageData(0, 0, c.width, c.height).data };
}

// ---------- 減色:先用 k-means 找出 k 個代表色,再讓每格取「小點裡出現最多」的顏色 ----------
// 取最多而不是取平均,輪廓線和色塊交界才不會混成模糊的中間色
function quantize(S, k){
  var d = S.data, s = S.s, w = S.w, h = S.h, W = S.W, n = w * h;
  // 1. 透明度:平均不到一半的格子不放豆子
  var opaque = new Uint8Array(n);
  for (var cy = 0; cy < h; cy++) for (var cx = 0; cx < w; cx++) {
    var a = 0;
    for (var yy = 0; yy < s; yy++) for (var xx = 0; xx < s; xx++) a += d[((cy * s + yy) * W + cx * s + xx) * 4 + 3];
    opaque[cy * w + cx] = a / (s * s) >= 128 ? 1 : 0;
  }
  // 2. 顏色直方圖(每色 5 bit),k-means 在直方圖上做,221 色也很快
  var binOf = new Int32Array(d.length / 4).fill(-1), binIndex = new Map(), bins = [];
  for (var cy2 = 0; cy2 < h; cy2++) for (var cx2 = 0; cx2 < w; cx2++) {
    if (!opaque[cy2 * w + cx2]) continue;
    for (var y2 = 0; y2 < s; y2++) for (var x2 = 0; x2 < s; x2++) {
      var pi = (cy2 * s + y2) * W + cx2 * s + x2, i = pi * 4;
      if (d[i + 3] < 128) continue;
      var key = (d[i] >> 3) << 10 | (d[i + 1] >> 3) << 5 | (d[i + 2] >> 3), b = binIndex.get(key);
      if (b === undefined) { b = bins.length; binIndex.set(key, b); bins.push([0, 0, 0, 0]); }
      var B = bins[b]; B[0] += d[i]; B[1] += d[i + 1]; B[2] += d[i + 2]; B[3]++;
      binOf[pi] = b;
    }
  }
  var assign = new Array(n).fill(-1);
  if (!bins.length) return { palette: [], assign: assign };
  var rgb = bins.map(function(B){ return [B[0] / B[3], B[1] / B[3], B[2] / B[3]]; });
  var lab = rgb.map(function(c){ return rgbToLab(c[0], c[1], c[2]); });
  var wt = bins.map(function(B){ return B[3]; });
  k = Math.min(k, bins.length);
  // 3. k-means++(依小點數量加權)
  var rand = rng(20261007), first = 0, best0 = -1;
  wt.forEach(function(v, j){ if (v > best0) { best0 = v; first = j; } });
  var cent = [lab[first].slice()], dmin = lab.map(function(p){ return dist2(p, cent[0]); });
  while (cent.length < k) {
    var sum = 0; for (var q = 0; q < lab.length; q++) sum += dmin[q] * wt[q];
    if (sum <= 0) break;
    var t = rand() * sum, j = 0;
    while (j < lab.length - 1 && (t -= dmin[j] * wt[j]) > 0) j++;
    cent.push(lab[j].slice());
    for (var q2 = 0; q2 < lab.length; q2++) dmin[q2] = Math.min(dmin[q2], dist2(lab[q2], lab[j]));
  }
  var memb = new Int32Array(lab.length).fill(-1);
  for (var it = 0; it < 30; it++) {
    var moved = false, acc = cent.map(function(){ return [0, 0, 0, 0]; });
    for (var p = 0; p < lab.length; p++) {
      var bi = 0, bd = Infinity;
      for (var c = 0; c < cent.length; c++) { var dd = dist2(lab[p], cent[c]); if (dd < bd) { bd = dd; bi = c; } }
      if (memb[p] !== bi) { memb[p] = bi; moved = true; }
      var A = acc[bi], ww = wt[p]; A[0] += lab[p][0] * ww; A[1] += lab[p][1] * ww; A[2] += lab[p][2] * ww; A[3] += ww;
    }
    cent = cent.map(function(c0, c){ var A = acc[c]; return A[3] ? [A[0] / A[3], A[1] / A[3], A[2] / A[3]] : c0; });
    if (!moved) break;
  }
  // 4. 每個代表色的 RGB 用成員原始顏色的加權平均
  var pal = cent.map(function(){ return [0, 0, 0, 0]; });
  for (var p2 = 0; p2 < lab.length; p2++) { var P = pal[memb[p2]], B2 = bins[p2]; P[0] += B2[0]; P[1] += B2[1]; P[2] += B2[2]; P[3] += B2[3]; }
  // 5. 每格投票:小點最多的代表色勝出
  var votes = new Int32Array(cent.length), touched = [];
  for (var cy3 = 0; cy3 < h; cy3++) for (var cx3 = 0; cx3 < w; cx3++) {
    var cell = cy3 * w + cx3;
    if (!opaque[cell]) continue;
    for (var y3 = 0; y3 < s; y3++) for (var x3 = 0; x3 < s; x3++) {
      var bb = binOf[(cy3 * s + y3) * W + cx3 * s + x3];
      if (bb < 0) continue;
      var m = memb[bb];
      if (votes[m]++ === 0) touched.push(m);
    }
    var win = -1, wv = 0;
    touched.forEach(function(m2){ if (votes[m2] > wv) { wv = votes[m2]; win = m2; } votes[m2] = 0; });
    touched.length = 0;
    assign[cell] = win;
  }
  return { palette: pal.map(function(P){ return P[3] ? [P[0] / P[3], P[1] / P[3], P[2] / P[3]] : null; }), assign: assign };
}

// ---------- 去背:和邊緣相連、且與四角主要顏色相同的格子變空白 ----------
function removeBackground(assign, w, h){
  var corners = [0, w - 1, (h - 1) * w, h * w - 1].map(function(i){ return assign[i]; }).filter(function(v){ return v >= 0; });
  if (!corners.length) return;
  var cnt = {}; corners.forEach(function(v){ cnt[v] = (cnt[v] || 0) + 1; });
  var bgc = +Object.keys(cnt).sort(function(a, b){ return cnt[b] - cnt[a]; })[0];
  var stack = [];
  for (var x = 0; x < w; x++) { stack.push(x, (h - 1) * w + x); }
  for (var y = 0; y < h; y++) { stack.push(y * w, y * w + w - 1); }
  while (stack.length) {
    var i = stack.pop();
    if (assign[i] !== bgc) continue;
    assign[i] = -1;
    var cx = i % w, cy = (i - cx) / w;
    if (cx > 0) stack.push(i - 1);
    if (cx < w - 1) stack.push(i + 1);
    if (cy > 0) stack.push(i - w);
    if (cy < h - 1) stack.push(i + w);
  }
}

// ---------- 依用量排序、重新編號 ----------
function finalize(q){
  var counts = q.palette.map(function(){ return 0; });
  q.assign.forEach(function(a){ if (a >= 0) counts[a]++; });
  var order = q.palette.map(function(_, i){ return i; }).filter(function(i){ return counts[i] > 0; })
    .sort(function(a, b){ return counts[b] - counts[a]; });
  var remap = {}; order.forEach(function(o, n){ remap[o] = n; });
  return {
    colors: order.map(function(o){ return { rgb: q.palette[o], count: counts[o] }; }),
    grid: q.assign.map(function(a){ return a >= 0 ? remap[a] : -1; })
  };
}

// ---------- 畫圖紙 ----------
function draw(p, w, h, showNums){
  var cell = Math.max(showNums ? 22 : 12, Math.min(64, Math.floor(3200 / Math.max(w, h))));
  var m = Math.round(cell * 1.4);                       // 上方與左方留給座標數字
  var c = document.createElement('canvas'); c.width = m + w * cell + 2; c.height = m + h * cell + 2;
  var x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
  x.textAlign = 'center'; x.textBaseline = 'middle';
  for (var cy = 0; cy < h; cy++) for (var cx = 0; cx < w; cx++) {
    var v = p.grid[cy * w + cx], X = m + cx * cell, Y = m + cy * cell;
    if (v < 0) { x.fillStyle = '#f3f3f1'; x.fillRect(X, Y, cell, cell); continue; }
    var col = p.colors[v].rgb;
    x.fillStyle = hex(col); x.fillRect(X, Y, cell, cell);
    if (showNums) {
      x.fillStyle = textOn(col);
      var digits = String(v + 1).length;
      x.font = '600 ' + Math.round(cell * (digits >= 3 ? 0.34 : digits === 2 ? 0.42 : 0.5)) + 'px -apple-system, "Segoe UI", sans-serif';
      x.fillText(String(v + 1), X + cell / 2, Y + cell / 2 + 1);
    }
  }
  for (var i = 0; i <= w; i++) line(x, m + i * cell, m, m + i * cell, m + h * cell, i % 10 === 0 || i === w);
  for (var j = 0; j <= h; j++) line(x, m, m + j * cell, m + w * cell, m + j * cell, j % 10 === 0 || j === h);
  x.fillStyle = '#555'; x.font = '600 ' + Math.round(cell * 0.5) + 'px -apple-system, "Segoe UI", sans-serif';
  for (var a = 10; a <= w; a += 10) x.fillText(String(a), m + (a - 0.5) * cell, m / 2);
  for (var b = 10; b <= h; b += 10) x.fillText(String(b), m / 2, m + (b - 0.5) * cell);
  return c;
}
function line(x, x1, y1, x2, y2, bold){
  x.strokeStyle = bold ? '#222' : 'rgba(0,0,0,.18)'; x.lineWidth = bold ? 2 : 1;
  x.beginPath(); x.moveTo(x1 + .5, y1 + .5); x.lineTo(x2 + .5, y2 + .5); x.stroke();
}

function renderLegend(p){
  var box = $('legend'); box.innerHTML = '';
  p.colors.forEach(function(c, i){
    var chip = document.createElement('div'); chip.className = 'chip';
    var sw = document.createElement('div'); sw.className = 'sw';
    sw.style.background = hex(c.rgb); sw.style.color = textOn(c.rgb); sw.textContent = i + 1;
    var t = document.createElement('div');
    t.innerHTML = '<b>' + c.count + ' 顆</b><span>' + hex(c.rgb) + '</span>';
    chip.appendChild(sw); chip.appendChild(t); box.appendChild(chip);
  });
}

// ---------- 介面 ----------
function clampInt(v){ v = parseInt(v, 10); return isNaN(v) ? null : Math.max(5, Math.min(150, v)); }
function syncFromW(){ var w = clampInt($('w').value); if (w && $('keep').checked) $('h').value = Math.max(5, Math.min(150, Math.round(w * ratio))); }
function syncFromH(){ var h = clampInt($('h').value); if (h && $('keep').checked) $('w').value = Math.max(5, Math.min(150, Math.round(h / ratio))); }
$('w').addEventListener('input', syncFromW);
$('h').addEventListener('input', syncFromH);
$('keep').addEventListener('change', syncFromW);
function colorCount(){ var v = parseInt($('kn').value, 10); v = isNaN(v) ? 12 : Math.max(2, Math.min(221, v)); $('kn').value = v; $('k').value = v; return v; }
$('k').addEventListener('input', function(){ $('kn').value = this.value; });
$('kn').addEventListener('change', function(){ colorCount(); generate(); });

$('file').addEventListener('change', function(){
  var f = this.files[0]; if (!f) return;
  var im = new Image();
  im.onload = function(){
    img = im; ratio = im.naturalHeight / im.naturalWidth;
    $('preview').src = im.src; $('preview').hidden = false;
    syncFromW(); $('go').disabled = false; $('status').textContent = '';
    generate();
  };
  im.onerror = function(){ $('status').textContent = '無法讀取這張照片,請換一張試試。'; };
  im.src = URL.createObjectURL(f);
});

function generate(){
  if (!img) return;
  var w = clampInt($('w').value), h = clampInt($('h').value);
  if (!w || !h) { $('status').textContent = '寬和高請填 5 到 150 之間的數字。'; return; }
  $('w').value = w; $('h').value = h;
  $('status').textContent = '產生中…';
  setTimeout(function(){
    var q = quantize(sample(img, w, h), colorCount());
    if ($('bg').checked) removeBackground(q.assign, w, h);
    var p = finalize(q);
    var canvas = draw(p, w, h, $('nums').checked);
    lastPng = canvas.toDataURL('image/png');
    $('out').src = lastPng;
    var total = p.colors.reduce(function(a, c){ return a + c.count; }, 0);
    $('summary').textContent = w + ' × ' + h + ' 格,' + p.colors.length + ' 色,共需 ' + total + ' 顆';
    renderLegend(p);
    $('result').hidden = false;
    $('status').textContent = '';
    window.LAST_PATTERN = { w: w, h: h, colors: p.colors.length, total: total, empty: p.grid.filter(function(v){ return v < 0; }).length };
  }, 20);
}
$('go').addEventListener('click', generate);
['nums', 'bg'].forEach(function(id){ $(id).addEventListener('change', generate); });
$('k').addEventListener('change', generate);

$('dl').addEventListener('click', function(){
  if (!lastPng) return;
  var a = document.createElement('a');
  a.href = lastPng; a.download = '拼豆圖紙.png';
  document.body.appendChild(a); a.click(); a.remove();
});
</script>
</body>
</html>
