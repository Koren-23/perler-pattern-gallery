<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="上傳圖庫">
<title>上傳到拼豆圖庫</title>
<style>
  :root{
    --bg:#f7f7f5; --panel:#ffffff; --ink:#1f2328; --ink-soft:#6b7280;
    --border:#e6e6e3; --accent:#2563eb; --accent-ink:#ffffff; --danger:#dc2626; --ok:#16a34a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;}
  .app{max-width:520px;margin:0 auto;padding:14px 16px 40px;}
  header{padding:6px 2px 14px;}
  header h1{font-size:1.2rem;font-weight:700;margin:0;}
  header p{margin:4px 0 0;font-size:.8rem;color:var(--ink-soft);}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;}
  .card h2{font-size:.95rem;margin:0 0 8px;}
  .card p,.card ol{font-size:.82rem;color:var(--ink-soft);line-height:1.6;margin:0 0 10px;}
  .card ol{padding-left:1.2em;}
  label.field{display:block;font-size:.8rem;font-weight:600;margin:0 0 6px;}
  select,input[type=password],input[type=text]{width:100%;font-size:1rem;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--panel);color:var(--ink);}
  .pick{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:12px;padding:14px;border:1.5px dashed var(--border);
    border-radius:12px;font-weight:600;font-size:.95rem;color:var(--accent);cursor:pointer;}
  .pick.disabled{opacity:.4;pointer-events:none;}
  .group-title{font-size:.85rem;font-weight:700;margin:14px 0 6px;}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
  .cell{position:relative;}
  .grid img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px;border:1px solid var(--border);display:block;}
  .remove{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:none;background:rgba(0,0,0,.6);
    color:#fff;font-size:.75rem;line-height:24px;padding:0;cursor:pointer;}
  button{font:inherit;}
  .primary{width:100%;margin-top:12px;background:var(--accent);color:var(--accent-ink);border:none;border-radius:10px;padding:12px;font-size:1rem;font-weight:700;cursor:pointer;}
  .primary:disabled{opacity:.4;cursor:default;}
  .status{font-size:.85rem;margin-top:10px;line-height:1.5;white-space:pre-line;}
  .status.err{color:var(--danger);}
  .status.ok{color:var(--ok);}
  .foot{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;padding:4px 2px;}
  .foot a{color:var(--accent);text-decoration:none;}
  .newcat-toggle{margin-top:8px;color:var(--accent);text-decoration:none;font-weight:600;}
  .newcat{margin-top:8px;padding:12px;border:1px solid var(--border);border-radius:12px;display:grid;gap:8px;}
  .secondary{background:var(--bg);color:var(--ink);border:1px solid var(--border);border-radius:10px;padding:10px;font-size:.95rem;font-weight:600;cursor:pointer;}
  .secondary:disabled{opacity:.4;cursor:default;}
  .link{background:none;border:none;color:var(--ink-soft);padding:0;cursor:pointer;text-decoration:underline;font-size:.8rem;}
</style>
</head>
<body>
<div class="app">
  <header><h1>📤 上傳到拼豆圖庫</h1><p>選分類、選照片,按上傳。縮圖與清單會自動產生,約 1 分鐘後出現在圖庫。</p></header>

  <section class="card" id="setup" hidden>
    <h2>第一次使用:貼上 GitHub 權杖</h2>
    <p>權杖只會存在這支手機裡,不會上傳到網站。取得方式見 README「手機上傳」。</p>
    <input type="password" id="tokenInput" placeholder="github_pat_…" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="primary" id="saveToken">儲存並開始</button>
    <div class="status" id="setupStatus"></div>
  </section>

  <section id="main" hidden>
    <div class="card">
      <label class="field" for="cat">分類</label>
      <select id="cat"></select>
      <button class="link newcat-toggle" id="newCatToggle" type="button">＋ 新增分類</button>
      <div class="newcat" id="newCatBox" hidden>
        <input type="text" id="newCatName" placeholder="分類名稱,例如:小熊" autocomplete="off">
        <input type="text" id="newCatIcon" placeholder="圖示(可留空,預設 📁)" autocomplete="off">
        <button class="secondary" id="newCatBtn" type="button">建立分類</button>
        <div class="status" id="newCatStatus"></div>
      </div>
      <label class="pick" id="pickLabel">📷 選擇照片加入這個分類<input type="file" id="files" accept="image/*" multiple hidden></label>
      <div id="queue"></div>
      <button class="primary" id="uploadBtn" disabled>上傳</button>
      <div class="status" id="status"></div>
    </div>
    <div class="foot"><a href="./">← 回圖庫</a><button class="link" id="resetToken">清除這支手機的權杖</button></div>
  </section>
</div>
<script>
var OWNER = 'Koren-23', REPO = 'perler-pattern-gallery', BRANCH = 'main';
var API = 'https://api.github.com/repos/' + OWNER + '/' + REPO;
// 與 tools/update_gallery.py 相同的規格
var THUMB_BOX = 300, THUMB_Q = 0.8, MAX_SIDE = 2560, ORIG_Q = 0.9;
var STANDARD_NAME = /^\d{3}\.jpg$/;
var DATA_LINE = /^var DATA=.*;$/m;

var $ = function(id){ return document.getElementById(id); };
var token = null, photos = null, picked = [], busy = false;

function getStored(k){ try { return localStorage.getItem(k); } catch(e) { return null; } }
function setStored(k, v){ try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch(e) {} }

function setStatus(el, text, kind){ el.textContent = text; el.className = 'status' + (kind ? ' ' + kind : ''); }

async function gh(path, method, body){
  var r = await fetch(API + path, {
    method: method || 'GET',
    cache: 'no-store',
    headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' },
    body: body ? JSON.stringify(body) : undefined
  });
  if (!r.ok) {
    var e = new Error('GitHub 回應 ' + r.status + ':' + (await r.text()).slice(0, 200));
    e.status = r.status;
    throw e;
  }
  return r.json();
}

function b64ToText(b64){
  var bin = atob(b64.replace(/\s/g, ''));
  var bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function bytesToB64(bytes){
  var s = '';
  for (var i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}

// 與 Python json.dumps(..., ensure_ascii=False) 輸出一致,讓電腦端的工具不會產生多餘差異
function pyCompact(v){
  if (Array.isArray(v)) return '[' + v.map(pyCompact).join(', ') + ']';
  if (v && typeof v === 'object') return '{' + Object.keys(v).map(function(k){ return JSON.stringify(k) + ': ' + pyCompact(v[k]); }).join(', ') + '}';
  return JSON.stringify(v);
}
function pyIndent(v, ind){
  ind = ind || '';
  var nx = ind + ' ';
  if (Array.isArray(v)) {
    if (!v.length) return '[]';
    return '[\n' + v.map(function(x){ return nx + pyIndent(x, nx); }).join(',\n') + '\n' + ind + ']';
  }
  if (v && typeof v === 'object') {
    var ks = Object.keys(v);
    if (!ks.length) return '{}';
    return '{\n' + ks.map(function(k){ return nx + JSON.stringify(k) + ': ' + pyIndent(v[k], nx); }).join(',\n') + '\n' + ind + '}';
  }
  return JSON.stringify(v);
}

function nextNumber(files){
  var max = 0;
  files.forEach(function(f){ if (STANDARD_NAME.test(f)) max = Math.max(max, parseInt(f, 10)); });
  return max + 1;
}
function pad3(n){ return ('00' + n).slice(-3); }

function loadImage(file){
  return new Promise(function(resolve, reject){
    var img = new Image();
    img.onload = function(){ resolve(img); };
    img.onerror = function(){ reject(new Error('無法讀取照片:' + file.name)); };
    img.src = URL.createObjectURL(file);
  });
}
function encodeJpeg(img, box, quality){
  var s = Math.min(1, box / img.naturalWidth, box / img.naturalHeight);
  var w = Math.max(1, Math.round(img.naturalWidth * s)), h = Math.max(1, Math.round(img.naturalHeight * s));
  var c = document.createElement('canvas');
  c.width = w; c.height = h;
  var x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, w, h);
  x.drawImage(img, 0, 0, w, h);
  return new Promise(function(resolve, reject){
    c.toBlob(function(b){ b ? resolve(b) : reject(new Error('照片轉檔失敗')); }, 'image/jpeg', quality);
  });
}
async function blobB64(blob){ return bytesToB64(new Uint8Array(await blob.arrayBuffer())); }

// 原圖:已是 JPG 且不超過 MAX_SIDE 就原檔上傳,否則轉成 JPG 並縮小
async function prepare(file){
  var img = await loadImage(file);
  var small = Math.max(img.naturalWidth, img.naturalHeight) <= MAX_SIDE;
  var orig = (file.type === 'image/jpeg' && small) ? file : await encodeJpeg(img, MAX_SIDE, ORIG_Q);
  var thumb = await encodeJpeg(img, THUMB_BOX, THUMB_Q);
  URL.revokeObjectURL(img.src);
  return { orig: await blobB64(orig), thumb: await blobB64(thumb) };
}

async function loadPhotos(){
  var f = await gh('/contents/photos.json?ref=' + BRANCH);
  photos = JSON.parse(b64ToText(f.content));
  var sel = $('cat'), last = getStored('lastCat');
  sel.innerHTML = '';
  photos.forEach(function(c){
    var o = document.createElement('option');
    o.value = c.slug;
    o.textContent = c.icon + ' ' + c.name + '(' + c.files.length + ' 張)';
    sel.appendChild(o);
  });
  if (last && photos.some(function(c){ return c.slug === last; })) sel.value = last;
}

// 讀取 GitHub 上最新的清單與網頁,作為這次修改的基礎
async function readState(){
  var ref = await gh('/git/ref/heads/' + BRANCH);
  var head = ref.object.sha;
  var commit = await gh('/git/commits/' + head);
  var data = JSON.parse(b64ToText((await gh('/contents/photos.json?ref=' + head)).content));
  var html = b64ToText((await gh('/contents/index.html?ref=' + head)).content);
  return { head: head, baseTree: commit.tree.sha, data: data, html: html };
}

// 把 extra 檔案連同更新後的 photos.json / index.html 存成一個 commit
async function writeState(s, extra, message){
  if (!DATA_LINE.test(s.html)) throw new Error('index.html 裡找不到 var DATA=…; 這一行');
  var line = 'var DATA=' + pyCompact(s.data) + ';';
  var html = s.html.replace(DATA_LINE, function(){ return line; });
  var tree = extra.concat([
    { path: 'photos.json', mode: '100644', type: 'blob', content: pyIndent(s.data) },
    { path: 'index.html', mode: '100644', type: 'blob', content: html }
  ]);
  var t = await gh('/git/trees', 'POST', { base_tree: s.baseTree, tree: tree });
  var c = await gh('/git/commits', 'POST', { message: message, tree: t.sha, parents: [s.head] });
  await gh('/git/refs/heads/' + BRANCH, 'PATCH', { sha: c.sha });
}

// 422:這段期間 GitHub 上有其他更新,重新讀取後再試
async function withRetry(st, fn){
  for (var attempt = 0; ; attempt++) {
    try { return await fn(); }
    catch (e) {
      if (e.status === 422 && attempt < 2) { setStatus(st, '偵測到其他更新,重試中…'); continue; }
      throw e;
    }
  }
}

// 依分類分組,保留第一次出現的順序
function groupBySlug(items){
  var order = [], groups = {};
  items.forEach(function(it){
    if (!groups[it.slug]) { groups[it.slug] = []; order.push(it.slug); }
    groups[it.slug].push(it);
  });
  return order.map(function(slug){ return { slug: slug, items: groups[slug] }; });
}

// items: [{slug, orig, thumb}],可以橫跨多個分類,全部存成一個 commit
async function commitUploads(items){
  var s = await readState();
  var tree = [], results = [];
  groupBySlug(items).forEach(function(g){
    var cat = s.data.filter(function(c){ return c.slug === g.slug; })[0];
    if (!cat) throw new Error('找不到分類 ' + g.slug + ',可能已被改名,請重新整理頁面');
    var n = nextNumber(cat.files), names = [];
    g.items.forEach(function(b, i){
      var name = pad3(n + i) + '.jpg';
      names.push(name);
      tree.push({ path: 'images/' + g.slug + '/' + name, mode: '100644', type: 'blob', sha: b.orig });
      tree.push({ path: 'thumbs/' + g.slug + '/' + name, mode: '100644', type: 'blob', sha: b.thumb });
    });
    cat.files = cat.files.concat(names).sort();
    results.push({ cat: cat, names: names });
  });

  var label = function(names){ return names.length === 1 ? names[0].slice(0, 3) : names[0].slice(0, 3) + '-' + names[names.length - 1].slice(0, 3); };
  var msg = '手機上傳:' + results.map(function(r){ return r.cat.name + ' ' + label(r.names); }).join('、');
  await writeState(s, tree, msg);
  return results;
}

// 新分類:編號接在最大的 cNN 後面,資料夾名稱去掉 Windows 不允許的字元(例如「/」)
var INVALID_CHARS = /[\\\/:*?"<>|]/g;
async function commitNewCategory(name, icon){
  var s = await readState();
  if (s.data.some(function(c){ return c.name === name; })) throw new Error('已經有「' + name + '」這個分類');
  var max = 0;
  s.data.forEach(function(c){ var m = /^c(\d+)_/.exec(c.slug); if (m) max = Math.max(max, parseInt(m[1], 10)); });
  var slug = 'c' + ('0' + (max + 1)).slice(-2) + '_' + name.replace(INVALID_CHARS, '');
  s.data.push({ slug: slug, name: name, icon: icon || '📁', files: [] });
  await writeState(s, [{ path: 'images/' + slug + '/.gitkeep', mode: '100644', type: 'blob', content: '' }], '手機新增分類:' + name);
  return slug;
}

async function upload(){
  if (busy || !picked.length) return;
  busy = true;
  renderQueue();
  var st = $('status'), keepSlug = $('cat').value;
  try {
    var items = [];
    for (var i = 0; i < picked.length; i++) {
      setStatus(st, '處理並上傳照片 ' + (i + 1) + ' / ' + picked.length + '…');
      var p = await prepare(picked[i].file);
      var o = await gh('/git/blobs', 'POST', { content: p.orig, encoding: 'base64' });
      var t = await gh('/git/blobs', 'POST', { content: p.thumb, encoding: 'base64' });
      items.push({ slug: picked[i].slug, orig: o.sha, thumb: t.sha });
    }
    setStatus(st, '更新圖庫清單…');
    var results = await withRetry(st, function(){ return commitUploads(items); });
    var lines = results.map(function(r){ return r.cat.icon + ' ' + r.cat.name + ':' + r.names.length + ' 張'; });
    setStatus(st, '✅ 完成!共 ' + items.length + ' 張\n' + lines.join('\n') + '\n網站約 1 分鐘後更新。', 'ok');
    picked.forEach(function(p){ URL.revokeObjectURL(p.url); });
    picked = [];
    await loadPhotos();
    $('cat').value = keepSlug;
  } catch (e) {
    if (e.status === 401) { setStatus(st, '權杖無效或已過期,請重新設定。', 'err'); }
    else { setStatus(st, '❌ 上傳失敗:' + e.message + '\n照片仍保留在清單中,可以再按一次上傳。', 'err'); }
  } finally {
    busy = false;
    renderQueue();
  }
}

function catOf(slug){ return (photos || []).filter(function(c){ return c.slug === slug; })[0]; }

// 待上傳清單:依分類分組顯示,每張可按 ✕ 移除
function renderQueue(){
  var box = $('queue');
  box.innerHTML = '';
  groupBySlug(picked.map(function(p, i){ return { slug: p.slug, p: p, i: i }; })).forEach(function(g){
    var cat = catOf(g.slug);
    var h = document.createElement('div');
    h.className = 'group-title';
    h.textContent = (cat ? cat.icon + ' ' + cat.name : g.slug) + '(' + g.items.length + ' 張)';
    box.appendChild(h);
    var grid = document.createElement('div');
    grid.className = 'grid';
    g.items.forEach(function(it){
      var cell = document.createElement('div');
      cell.className = 'cell';
      var img = document.createElement('img');
      img.src = it.p.url;
      cell.appendChild(img);
      if (!busy) {
        var x = document.createElement('button');
        x.className = 'remove'; x.type = 'button'; x.textContent = '✕';
        x.setAttribute('aria-label', '移除');
        x.addEventListener('click', function(){
          URL.revokeObjectURL(it.p.url);
          picked.splice(picked.indexOf(it.p), 1);
          renderQueue();
        });
        cell.appendChild(x);
      }
      grid.appendChild(cell);
    });
    box.appendChild(grid);
  });
  var n = picked.length, groups = groupBySlug(picked).length;
  $('uploadBtn').textContent = n ? '上傳全部(' + n + ' 張' + (groups > 1 ? '、' + groups + ' 個分類' : '') + ')' : '上傳';
  $('uploadBtn').disabled = !n || busy;
  $('pickLabel').classList.toggle('disabled', busy);
  $('files').disabled = busy;
}

$('files').addEventListener('change', function(){
  var slug = $('cat').value;
  setStored('lastCat', slug);
  Array.prototype.forEach.call(this.files, function(f){
    picked.push({ file: f, slug: slug, url: URL.createObjectURL(f) });
  });
  this.value = '';  // 讓同一批照片可以再選一次
  setStatus($('status'), picked.length ? '已加入清單。可以換一個分類,再選照片繼續加入。' : '');
  renderQueue();
});
$('uploadBtn').addEventListener('click', upload);

$('newCatToggle').addEventListener('click', function(){
  var box = $('newCatBox');
  box.hidden = !box.hidden;
  if (!box.hidden) $('newCatName').focus();
});
$('newCatBtn').addEventListener('click', async function(){
  var name = $('newCatName').value.trim(), icon = $('newCatIcon').value.trim();
  var st = $('newCatStatus');
  if (!name) { setStatus(st, '請輸入分類名稱', 'err'); return; }
  if (!name.replace(INVALID_CHARS, '')) { setStatus(st, '名稱需要包含文字', 'err'); return; }
  if (busy) return;
  busy = true;
  this.disabled = true;
  setStatus(st, '建立中…');
  try {
    var slug = await withRetry(st, function(){ return commitNewCategory(name, icon); });
    await loadPhotos();
    $('cat').value = slug;
    setStored('lastCat', slug);
    $('newCatName').value = ''; $('newCatIcon').value = '';
    $('newCatBox').hidden = true;
    setStatus($('status'), '✅ 已建立「' + name + '」分類,現在可以選照片上傳了。', 'ok');
    setStatus(st, '');
  } catch (e) {
    setStatus(st, e.status === 401 ? '權杖無效或已過期,請重新設定。' : '❌ ' + e.message, 'err');
  } finally {
    busy = false;
    this.disabled = false;
  }
});

async function start(){
  token = getStored('ghToken');
  if (!token) { $('setup').hidden = false; $('main').hidden = true; return; }
  try {
    await loadPhotos();
    $('setup').hidden = true; $('main').hidden = false;
  } catch (e) {
    $('setup').hidden = false; $('main').hidden = true;
    setStatus($('setupStatus'), e.status === 401 ? '權杖無效或已過期,請重新貼上。' : '連線失敗:' + e.message, 'err');
  }
}
$('saveToken').addEventListener('click', async function(){
  var v = $('tokenInput').value.trim();
  if (!v) return;
  token = v;
  setStatus($('setupStatus'), '檢查權杖…');
  try {
    var repo = await gh('');
    if (!repo.permissions || !repo.permissions.push) throw new Error('這個權杖沒有寫入權限,請確認 Contents 設為 Read and write');
    setStored('ghToken', v);
    $('tokenInput').value = '';
    setStatus($('setupStatus'), '');
    await start();
  } catch (e) {
    token = null;
    setStatus($('setupStatus'), e.status === 401 ? '權杖無效,請確認有完整複製。' : e.message, 'err');
  }
});
$('resetToken').addEventListener('click', function(){
  setStored('ghToken', null);
  token = null;
  start();
});
start();
</script>
</body>
</html>
